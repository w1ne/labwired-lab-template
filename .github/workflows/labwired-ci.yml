name: LabWired Simulator Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the released CLI and test the committed firmware
        uses: LabWired/firmware-test@440c7386fd34e6226eefd47fa5937ca82dc815e4 # v1
        with:
          version: v0.25.0
          script: tests/firmware-regression.yaml
          output_dir: out/positive
          comment: 'false'
          gallery: 'false'
      - name: Verify an incorrect assertion fails
        run: python3 scripts/check-gate.py --negative-only
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labwired-sim-output
          path: out/
          if-no-files-found: warn
